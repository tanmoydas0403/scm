<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contact">
    <!-- Contact View Modal -->
    <div id="view_contact_modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-4xl max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-lg dark:bg-gray-800">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white">
                        Contact Details
                    </h3>
                    <button onclick="closeContactModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white transition duration-150">
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                
                <!-- Modal body -->
                <div class="p-6 space-y-6">
                    <div class="flex flex-col md:flex-row gap-8">
                        <!-- Contact Image - Updated for better visibility -->
                        <div class="flex-shrink-0 flex flex-col items-center">
                            <div class="relative">
                                <img id="contact_image" src="" 
                                     class="w-48 h-48 md:w-56 md:h-56 rounded-full object-cover border-4 border-blue-200 dark:border-blue-600 shadow-xl"
                                     alt="Contact picture"
                                     onerror="this.src='https://www.shutterstock.com/image-vector/default-avatar-profile-icon-social-600nw-1677509740.jpg'">
                                <!-- Favorite badge on image -->
                                <div id="image_favorite_badge" class="absolute -top-2 -right-2 hidden">
                                    <i class="fas fa-star text-yellow-500 text-2xl bg-white dark:bg-gray-800 rounded-full p-1 shadow-lg"></i>
                                </div>
                            </div>
                            <!-- Name under image for mobile -->
                            <div class="mt-4 md:hidden text-center">
                                <h4 id="contact_name_mobile" class="text-2xl font-bold text-gray-900 dark:text-white"></h4>
                                <div id="contact_favorite_mobile" class="mt-1"></div>
                            </div>
                        </div>
                        
                        <!-- Contact Details -->
                        <div class="flex-1 space-y-4">
                            <!-- Name and Favorite - Hidden on mobile, shown on desktop -->
                            <div class="hidden md:flex items-center gap-4">
                                <h4 id="contact_name" class="text-3xl font-bold text-gray-900 dark:text-white"></h4>
                                <span id="contact_favorite"></span>
                            </div>
                            
                            <!-- Basic Info Grid -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Phone -->
                                <div class="flex items-center gap-3 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                    <i class="fas fa-phone text-blue-600 dark:text-blue-400 text-lg"></i>
                                    <div>
                                        <p class="text-sm text-gray-500 dark:text-gray-400">Phone</p>
                                        <p id="contact_phone" class="font-semibold text-gray-900 dark:text-white text-lg"></p>
                                    </div>
                                </div>
                                
                                <!-- Email -->
                                <div class="flex items-center gap-3 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                    <i class="fas fa-envelope text-blue-600 dark:text-blue-400 text-lg"></i>
                                    <div>
                                        <p class="text-sm text-gray-500 dark:text-gray-400">Email</p>
                                        <p id="contact_email" class="font-semibold text-gray-900 dark:text-white text-lg break-all"></p>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Address -->
                            <div id="contact_address_container" class="flex items-start gap-3 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                <i class="fas fa-map-marker-alt text-blue-600 dark:text-blue-400 text-lg mt-1"></i>
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">Address</p>
                                    <p id="contact_address" class="font-semibold text-gray-900 dark:text-white"></p>
                                </div>
                            </div>
                            
                            <!-- Description -->
                            <div id="contact_about_container" class="flex items-start gap-3 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                <i class="fas fa-info-circle text-blue-600 dark:text-blue-400 text-lg mt-1"></i>
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">Description</p>
                                    <p id="contact_about" class="text-gray-900 dark:text-white"></p>
                                </div>
                            </div>
                            
                            <!-- Links -->
                            <div class="flex flex-wrap gap-3">
                                <div id="contact_website_container" class="hidden">
                                    <a id="contact_website" href="#" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-lg hover:bg-blue-200 dark:hover:bg-blue-900/50 transition duration-150">
                                        <i class="fas fa-globe"></i>
                                        Website
                                    </a>
                                </div>
                                <div id="contact_linkedIn_container" class="hidden">
                                    <a id="contact_linkedIn" href="#" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-lg hover:bg-blue-200 dark:hover:bg-blue-900/50 transition duration-150">
                                        <i class="fab fa-linkedin"></i>
                                        LinkedIn
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Modal footer -->
                <div class="flex items-center justify-end p-6 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50 rounded-b-lg">
                    <button onclick="closeContactModal()" type="button" class="px-6 py-2.5 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 hover:text-gray-900 focus:ring-4 focus:ring-gray-200 dark:bg-gray-600 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700 transition duration-150">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Contact Modal -->
    <div id="edit_contact_modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-4xl max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-lg dark:bg-gray-800">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white">
                        Edit Contact
                    </h3>
                    <button onclick="closeEditModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white transition duration-150">
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                
                <!-- Modal body -->
                <div class="p-6">
                    <form id="editContactForm" enctype="multipart/form-data">
                        <input type="hidden" id="edit_contact_id" name="id">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Left Column -->
                            <div class="space-y-4">
                                <!-- Name -->
                                <div>
                                    <label for="edit_name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Name *</label>
                                    <input type="text" id="edit_name" name="name" required
                                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                </div>
                                
                                <!-- Email -->
                                <div>
                                    <label for="edit_email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                                    <input type="email" id="edit_email" name="email"
                                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                </div>
                                
                                <!-- Phone -->
                                <div>
                                    <label for="edit_phone" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Phone Number *</label>
                                    <input type="tel" id="edit_phone" name="phoneNumber" required
                                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                </div>
                                
                                <!-- Address -->
                                <div>
                                    <label for="edit_address" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Address</label>
                                    <textarea id="edit_address" name="address" rows="3"
                                              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"></textarea>
                                </div>
                            </div>
                            
                            <!-- Right Column -->
                            <div class="space-y-4">
                                <!-- Profile Picture -->
                                <div>
                                    <label for="edit_picture" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Profile Picture</label>
                                    <div class="flex items-center gap-4">
                                        <img id="edit_picture_preview" 
                                             class="w-20 h-20 rounded-full object-cover border border-gray-300 dark:border-gray-600"
                                             src="https://www.shutterstock.com/image-vector/default-avatar-profile-icon-social-600nw-1677509740.jpg"
                                             alt="Profile preview">
                                        <input type="file" id="edit_picture" name="contactImage" accept="image/*"
                                               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-blue-900 dark:file:text-blue-300"
                                               onchange="previewEditImage(this)">
                                    </div>
                                </div>
                                
                                <!-- Favorite -->
                                <div class="flex items-center">
                                    <input type="checkbox" id="edit_favorite" name="favorite"
                                           class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                    <label for="edit_favorite" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300">Mark as Favorite</label>
                                </div>
                                
                                <!-- Website -->
                                <div>
                                    <label for="edit_website" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Website</label>
                                    <input type="url" id="edit_website" name="websiteLink"
                                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                </div>
                                
                                <!-- LinkedIn -->
                                <div>
                                    <label for="edit_linkedin" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">LinkedIn</label>
                                    <input type="url" id="edit_linkedin" name="linkedInLink"
                                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Description -->
                        <div class="mt-6">
                            <label for="edit_description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
                            <textarea id="edit_description" name="description" rows="4"
                                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"></textarea>
                        </div>
                    </form>
                </div>
                
                <!-- Modal footer -->
                <div class="flex items-center justify-end p-6 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50 rounded-b-lg gap-3">
                    <button onclick="closeEditModal()" type="button" class="px-6 py-2.5 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 hover:text-gray-900 focus:ring-4 focus:ring-gray-200 dark:bg-gray-600 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700 transition duration-150">
                        Cancel
                    </button>
                    <button onclick="submitEditForm()" type="button" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-200 flex items-center gap-2">
                        <i class="fas fa-save"></i>
                        Update Contact
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete_contact_modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                        <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                        Delete Contact
                    </h3>
                    <button type="button" onclick="closeDeleteModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <div class="p-4 md:p-5 space-y-4">
                    <p class="text-gray-500 dark:text-gray-400">Are you sure you want to delete this contact? This action cannot be undone.</p>
                    <div id="delete_contact_info" class="text-sm text-gray-600 dark:text-gray-300">
                        <!-- Contact info will be populated here by JavaScript -->
                    </div>
                </div>
                <!-- Modal footer -->
                <div class="flex items-center justify-end p-4 md:p-5 border-t border-gray-200 dark:border-gray-600 rounded-b gap-3">
                    <button onclick="closeDeleteModal()" type="button" class="py-2.5 px-5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700 transition duration-150">
                        Cancel
                    </button>
                    <button onclick="confirmDelete()" type="button" class="text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-red-500 dark:hover:bg-red-600 dark:focus:ring-red-900 transition duration-150">
                        <i class="fas fa-trash mr-2"></i>
                        Delete Contact
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
