<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title>Search Contacts</title>
  </head>
  <body>
    <div id="content">
      <!-- Navigation Sidebar -->
      <div th:if="${loggedInUser}">
        <div th:replace="~{user/sidebar :: sidebar}"></div>
      </div>

      <div class="sm:pl-64 pt-20 min-h-screen">
        <div class="flex justify-center flex-col items-center mb-8">
          <h1 class="text-5xl font-bold text-gray-800 dark:text-white mb-4">Search Results</h1>
          <p class="text-lg text-gray-600 dark:text-gray-300 text-center max-w-2xl">
            Find your contacts by searching through names, email addresses, or phone numbers.
          </p>
        </div>

        <div class="contacts_container px-5 max-w-7xl mx-auto">
          <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
            <!-- Search Form -->
            <form th:action="@{/user/contacts/search}" method="get" class="bg-white dark:bg-gray-800 rounded-t-lg">
              <div class="flex p-6 items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4 flex-1 min-w-[300px]">
                  <!-- Search Field Selection -->
                  <div class="w-48">
                    <label for="searchField" class="sr-only">Search Field</label>
                    <select name="field" id="searchField" 
                            class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                      <option value="name" th:selected="${searchField == 'name'}">Name</option>
                      <option value="email" th:selected="${searchField == 'email'}">Email</option>
                      <option value="phone" th:selected="${searchField == 'phone'}">Phone</option>
                    </select>
                  </div>
                  
                  <!-- Search Input -->
                  <div class="flex-1 max-w-2xl">
                    <label for="searchKeyword" class="sr-only">Search</label>
                    <div class="relative">
                      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fas fa-search text-gray-500 dark:text-gray-400"></i>
                      </div>
                      <input type="text" name="keyword" id="searchKeyword"
                             th:value="${searchKeyword}"
                             class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-900 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                             placeholder="Enter search term...">
                    </div>
                  </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-2">
                  <button type="submit" 
                          class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fas fa-search"></i>
                    Search
                  </button>
                  <a th:href="@{/user/contacts}" 
                     class="px-6 py-2.5 bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fas fa-times"></i>
                    Clear
                  </a>
                </div>
              </div>
            </form>

            <!-- Search Results Summary -->
            <div th:if="${searchKeyword != null && !searchKeyword.empty}" 
                 class="bg-blue-50 dark:bg-blue-900/20 px-6 py-4 border-b border-blue-100 dark:border-blue-800">
              <p class="text-blue-800 dark:text-blue-300">
                Showing results for: <strong th:text="${searchKeyword}"></strong>
                <span th:if="${searchField != null && !searchField.empty}"> in <strong th:text="${searchField}"></strong></span>
                <span class="text-sm ml-4" th:text="${'Found ' + pageContact.totalElements + ' contacts'}"></span>
              </p>
            </div>

            <!-- Results Table -->
            <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
              <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                <tr>
                  <th scope="col" class="px-6 py-4">Name</th>
                  <th scope="col" class="px-6 py-4">Phone</th>
                  <th scope="col" class="px-6 py-4">Email</th>
                  <th scope="col" class="px-6 py-4">Links</th>
                  <th scope="col" class="px-6 py-4">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="contact : ${pageContact.content}" 
                    class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 transition duration-150">
                  <!-- Name Column -->
                  <td class="px-6 py-4">
                    <div class="flex items-center space-x-3">
                      <img th:src="${contact.picture != null ? contact.picture : 'https://www.shutterstock.com/image-vector/default-avatar-profile-icon-social-600nw-1677509740.jpg'}" 
                           class="w-10 h-10 rounded-full object-cover border border-gray-200 dark:border-gray-600"
                           alt="Profile picture">
                      <div>
                        <div class="font-semibold text-gray-900 dark:text-white" th:text="${contact.name}"></div>
                        <div th:if="${contact.favorite}" class="flex items-center gap-1 mt-1">
                          <i class="fas fa-star text-yellow-500 text-xs"></i>
                          <span class="text-xs text-gray-500 dark:text-gray-400">Favorite</span>
                        </div>
                      </div>
                    </div>
                  </td>
                  
                  <!-- Phone Column -->
                  <td class="px-6 py-4">
                    <div class="flex items-center gap-2">
                      <i class="fas fa-phone text-gray-400 text-sm"></i>
                      <span th:text="${contact.phoneNumber}" class="font-mono"></span>
                    </div>
                  </td>
                  
                  <!-- Email Column -->
                  <td class="px-6 py-4">
                    <span th:text="${contact.email}" class="text-blue-600 dark:text-blue-400 break-all"></span>
                  </td>
                  
                  <!-- Links Column -->
                  <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                      <a th:href="${contact.websiteLink}" 
                         th:if="${contact.websiteLink != null && !contact.websiteLink.empty}"
                         target="_blank" 
                         class="text-gray-600 hover:text-blue-600 dark:text-gray-400 dark:hover:text-blue-400 transition duration-150"
                         title="Website">
                        <i class="fas fa-link text-lg"></i>
                      </a>
                      <a th:href="${contact.linkedInLink}" 
                         th:if="${contact.linkedInLink != null && !contact.linkedInLink.empty}"
                         target="_blank" 
                         class="text-gray-600 hover:text-blue-600 dark:text-gray-400 dark:hover:text-blue-400 transition duration-150"
                         title="LinkedIn">
                        <i class="fab fa-linkedin text-lg"></i>
                      </a>
                      <span th:if="${(contact.websiteLink == null || contact.websiteLink.empty) && (contact.linkedInLink == null || contact.linkedInLink.empty)}" 
                            class="text-gray-400 text-sm italic">No links</span>
                    </div>
                  </td>
                  
                  <!-- Actions Column -->
                  <td class="px-6 py-4">
                    <div class="flex items-center gap-2">
                      <a th:href="@{'/user/contacts/view/' + ${contact.id}}" 
                         class="text-green-600 hover:text-green-800 dark:text-green-400 dark:hover:text-green-300 transition duration-150 p-1 rounded"
                         title="View">
                        <i class="fas fa-eye text-lg"></i>
                      </a>
                      <a th:href="@{'/user/contacts/edit/' + ${contact.id}}" 
                         class="text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300 transition duration-150 p-1 rounded"
                         title="Edit">
                        <i class="fas fa-edit text-lg"></i>
                      </a>
                      <a th:href="@{'/user/contacts/delete/' + ${contact.id}}" 
                         class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 transition duration-150 p-1 rounded"
                         title="Delete"
                         onclick="return confirm('Are you sure you want to delete this contact?');">
                        <i class="fas fa-trash text-lg"></i>
                      </a>
                    </div>
                  </td>
                </tr>
                
                <!-- Empty State -->
                <tr th:if="${pageContact.content.empty}">
                  <td colspan="5" class="px-6 py-12 text-center">
                    <div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400">
                      <i class="fas fa-search text-4xl mb-4 text-gray-300 dark:text-gray-600"></i>
                      <p class="text-lg font-medium mb-2">No contacts found</p>
                      <p class="text-sm mb-4" th:if="${searchKeyword != null && !searchKeyword.empty}">
                        No results found for "<span th:text="${searchKeyword}"></span>"
                      </p>
                      <a th:href="@{/user/contacts}" 
                         class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition duration-200 inline-flex items-center gap-2">
                        <i class="fas fa-list"></i>
                        View All Contacts
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- Pagination -->
            <div th:if="${pageContact.totalPages > 1}" class="p-6 border-t border-gray-200 dark:border-gray-700">
              <nav class="flex items-center justify-between">
                <div class="text-sm text-gray-700 dark:text-gray-400">
                  Page <span th:text="${pageContact.number + 1}"></span> of 
                  <span th:text="${pageContact.totalPages}"></span> • 
                  <span th:text="${pageContact.totalElements}"></span> total contacts
                </div>
                
                <div class="flex gap-1">
                  <!-- Previous Page -->
                  <a th:href="@{'/user/contacts/search?field=' + ${searchField} + '&keyword=' + ${searchKeyword} + '&page=' + ${pageContact.number - 1} + '&size=' + ${pageContact.size}}"
                     th:if="${pageContact.hasPrevious()}"
                     class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white transition duration-150">
                    Previous
                  </a>
                  
                  <!-- Page Numbers -->
                    <a th:href="@{'/user/contacts/search?field=' + ${searchField} + '&keyword=' + ${searchKeyword} + '&page=' + ${pageContact.number - 1} + '&size=' + ${pageContact.size}}"
                        th:if="${pageContact.hasPrevious()}"
                        class="px-3 py-2 text-sm font-weight-500 text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white transition duration-150">
                        Previous
                    </a>
                  
                  <!-- Next Page -->
                  <a th:href="@{'/user/contacts/search?field=' + ${searchField} + '&keyword=' + ${searchKeyword} + '&page=' + (pageContact.number + 1) + '&size=' + ${pageContact.size}}"
                     th:if="${pageContact.hasNext()}"
                     class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white transition duration-150">
                    Next
                  </a>
                </div>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript" th:src="@{/js/script.js}"></script>
  </body>
</html>
