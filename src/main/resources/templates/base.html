<!DOCTYPE html>
<html
        class="light"
        lang="en"
        th:fragment="parent(content,title,script)"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">SCM</title>

    <!-- Tailwind CSS (your built file) -->
    <link rel="stylesheet" th:href="@{/main.css}" />

    <!-- Flowbite CSS (optional, if using components) -->
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css"
            rel="stylesheet"
    />

    <!-- Font Awesome (for icons) -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
    />
</head>
<body class="bg-gray-100 dark:bg-gray-900 dark:text-gray-100">
<!-- Common header/navbar -->
<div data-th-if="${loggedInUser}">
    <div data-th-replace="~{user/user_navbar::user-navbar}"></div>
</div>
<div data-th-unless="${loggedInUser}">
    <div th:replace="~{navbar :: navbar}"></div>
</div>

<!-- Main content -->
<div>
    <section th:replace="${content}"></section>
</div>

<!-- JS Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/script.js}"></script>
<th:block th:replace="${script}"></th:block>
</body>
</html>
