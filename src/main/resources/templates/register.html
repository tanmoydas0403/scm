<!DOCTYPE html>
<html lang="en"
th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body>
    <div id="content" class="p-4 pt-16">
        <!-- The card container, now a div to correctly hold the form -->
        <div class="block p-4 bg-white border border-gray-200 rounded-lg shadow-sm w-full max-w-lg mx-auto
                   dark:bg-gray-800 dark:border-gray-700">

            <div data-th-replace="message::messagebox">

            </div>
            <!-- Card Header -->
            <div class="text-center mb-1">
                <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
                    Sign Up Here
                </h5>
                <p class="font-normal text-gray-400 dark:text-gray-400">
                    Start managing contacts on cloud
                </p>
            </div>

            <!-- The Form is now correctly a child of the div -->
            <form data-th-action="@{'/do-register'}" 
            method="post"
            data-th-object="${userForm}" 
            class="space-y-4"
            novalidate
            >
                <!-- Name input field -->
                <div>
                    <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Name</label>
                    <input type="text" id="name" 
                    data-th-field="*{name}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                    placeholder="Enter Here" required />

                    <p 
                    th:if="${#fields.hasErrors('name')}"
                    th:errors="*{name}"
                    class="text-red-600 px-1 py-2">
                    Name is required
                    </p>
                </div>
                
                <!-- Email input field -->
                <div>
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                    <input type="email" id="email" 
                    data-th-field="*{email}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="name@flowbite.com" required />

                    <p 
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                    class="text-red-600 px-1 py-2">
                    Email is required
                    </p>
                </div>
                
                <!-- Password input field -->
                <div>
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">New Password</label>
                    <input type="password" id="password" 
                    data-th-field="*{password}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                    required />

                    <p 
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"
                    class="text-red-600 px-1 py-2">
                    Password is required
                    </p>
                </div>
                
                <!-- PhoneNumber input field -->
                <div>
                    <label for="phone" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                      Contact Number
                    </label>
                    <input type="text" id="phone" 
                    data-th-field="*{phoneNumber}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                    required />

                    <p 
                    th:if="${#fields.hasErrors('phoneNumber')}"
                    th:errors="*{phoneNumber}"
                    class="text-red-600 px-1 py-2">
                    PhoneNumber is required
                    </p>
                </div>
                
                <!-- About text-->
                <div>
                    <label for="about" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Write something about yourself</label>
                    <textarea id="about" rows="6" 
                    data-th-field="*{about}"
                    class="block p-2.5 w-full text-sm 
                    text-gray-900 bg-gray-50 rounded-lg 
                    border border-gray-300 focus:ring-blue-500
                    focus:border-blue-500 dark:bg-gray-700
                    dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Write here..."></textarea>

                    <p 
                    th:if="${#fields.hasErrors('about')}"
                    th:errors="*{about}"
                    class="text-red-600 px-1 py-2">
                    About is required
                    </p>
                </div>
                
                <!-- Action Buttons -->
                <div class="mt-6 flex justify-center space-x-3">
                    <button type="submit" class="w-1/2 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors duration-200 dark:bg-blue-500 dark:hover:bg-blue-600 dark:focus:ring-blue-800">
                        Signup
                    </button>
                    <button type="reset" class="w-1/2 text-gray-900 border border-gray-300 bg-transparent hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors duration-200 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:focus:ring-gray-700">
                        Reset
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        console.log('Register page script loaded');
    </script>
</body>
</html>
